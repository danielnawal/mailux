services:
  api:
    image: node:20-slim
    working_dir: /app
    command: bash -c "[ -d node_modules/express ] && [ -d node_modules/nodemailer ] || (apt-get update && apt-get install -y python3 make g++ && npm ci --silent); node server.js"
    volumes:
      - ./api:/app
      - ./data:/app/../data
      - ./uploads:/app/../uploads
    environment:
      PORT: 4600
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
      MAILUX_BASE_URL: ${MAILUX_BASE_URL:-https://mailux.gpssoftwarenumberone.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-ses}
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
    restart: unless-stopped
    networks: [mailux]

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/uploads:ro
    ports:
      - "4902:80"
    depends_on: [api]
    restart: unless-stopped
    networks: [mailux]

networks:
  mailux:
    driver: bridge
