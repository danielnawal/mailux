server {
  listen 80;

  location /api/ {
    proxy_pass http://api:4600/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 30M;
    # Listas grandes validan el dominio de cada correo: damos margen de tiempo.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Webhooks de SNS (rebotes/quejas de SES) y captura pública de landing pages.
  location /webhooks/ {
    proxy_pass http://api:4600/webhooks/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /p/ {
    proxy_pass http://api:4600/p/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Imágenes y PDFs subidos para los correos (servidos estáticos, públicos).
  location /uploads/ {
    alias /var/www/uploads/;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    # Siempre revalidar para que el navegador no muestre una versión vieja en caché.
    add_header Cache-Control "no-cache";
  }
}
